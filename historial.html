<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.style.visibility = "hidden";</script>
  <script type="module" src="js/muro-login.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi historial — El Código de las Cartas</title>

  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .lectura-card {
      background: var(--bg-card);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 8px;
      padding: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .lectura-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .lectura-card__nombre {
      font-family: 'Cinzel', serif;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    .lectura-card__meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .lectura-card__detalle {
      display: none;
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .lectura-card__detalle.abierto { display: block; }
    .lectura-carta-item {
      display: flex;
      justify-content: space-between;
      padding: var(--space-1) 0;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .lectura-comb-item {
      padding: var(--space-2) 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.85rem;
    }
    .btn-eliminar-lectura {
      background: none;
      border: 1px solid rgba(224, 120, 86, 0.4);
      color: #e07856;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body data-page="historial">

  <header class="nav">
    <a href="index.html" class="nav__logo">El Código de las Cartas</a>
    <nav class="nav__links">
      <div id="auth-widget"></div>
      <a href="index.html" class="nav__link">
        <i class="ph ph-house" aria-hidden="true"></i>&nbsp;Inicio
      </a>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <div class="container--narrow">
        <h1 class="page-header__title">Mi historial</h1>
        <p class="page-header__subtitle">Tus lecturas guardadas, más reciente primero.</p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container--narrow" id="contenido">
        <p style="text-align:center; color: var(--text-muted);">
          <i class="ph ph-spinner" aria-hidden="true"></i> Verificando sesión…
        </p>
      </div>
    </section>
  </main>

  <footer class="section--tight" style="text-align:center; color: var(--text-muted); font-size: 0.8rem;">
    <p>El Código de las Cartas · Tarot de Marsella &amp; Rider-Waite-Smith</p>
  </footer>

  <script type="module">
    import { initAuthWidget } from './js/auth-widget.js';
    import { onCambioAuth } from './js/auth.js';
    import { getHistorialUsuario, eliminarLectura } from './js/historial.js';

    initAuthWidget('auth-widget');

    const contenido = document.getElementById('contenido');

    function _esc(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function _fecha(timestamp) {
      if (!timestamp || !timestamp.toDate) return '';
      return timestamp.toDate().toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Bloque "Mis notas" de una lectura guardada (solo muestra lo que se rellenó)
    function _htmlConsulta(c) {
      if (!c) return '';
      const campos = [
        ['Contexto de la consulta', c.contexto],
        ['Interpretación personal', c.interpretacionPersonal],
        ['Notas libres', c.notasLibres],
        ['Observaciones durante la lectura', c.observaciones],
        ['Carta o posición que llamó la atención', c.cartaDestacada],
      ].filter(([, v]) => v && String(v).trim());
      const etiquetas = (c.etiquetas || []).filter(Boolean);
      if (!campos.length && !etiquetas.length && !c.estadoAnimo) return '';
      const h = `font-family:'Cinzel',serif; color: var(--secondary); font-size: 0.85rem; margin: var(--space-3) 0 var(--space-1);`;
      return `
        <h3 style="${h}">Mis notas</h3>
        ${c.estadoAnimo ? `<p style="font-size:0.85rem;"><strong>Estado de ánimo:</strong> ${_esc(c.estadoAnimo)}</p>` : ''}
        ${etiquetas.length ? `<p style="font-size:0.85rem;"><strong>Etiquetas:</strong> ${etiquetas.map(_esc).join(' · ')}</p>` : ''}
        ${campos.map(([titulo, valor]) => `
          <p style="font-size:0.85rem; margin: var(--space-2) 0 2px;"><strong>${_esc(titulo)}</strong></p>
          <p style="font-size:0.85rem; white-space: pre-wrap; margin:0;">${_esc(valor)}</p>
        `).join('')}`;
    }

    // Veredicto: lecturas nuevas guardan las dos vistas; las antiguas, un solo bloque
    function _htmlVeredicto(l) {
      const h = `font-family:'Cinzel',serif; color: var(--secondary); font-size: 0.85rem; margin: var(--space-3) 0 var(--space-2);`;
      const caja = 'font-size: 0.85rem; color: var(--text-main); line-height: 1.6;';
      if (!l.vistaEstudioHtml && !l.vistaLecturaHtml) {
        return `<h3 style="${h}">Veredicto</h3>
          <div style="${caja}">${l.resultadoHtml || '<span style="color:var(--text-muted);">Sin veredicto guardado.</span>'}</div>`;
      }
      const id = _esc(l.id);
      const hayLectura = !!l.vistaLecturaHtml;
      return `
        <h3 style="${h}">Veredicto</h3>
        <div class="toggle-vista" role="tablist">
          <button type="button" class="toggle-vista__btn ${hayLectura ? 'toggle-vista__btn--activo' : ''}" data-vista-hist="lectura" data-lectura-id="${id}" role="tab">Vista de lectura</button>
          <button type="button" class="toggle-vista__btn ${hayLectura ? '' : 'toggle-vista__btn--activo'}" data-vista-hist="estudio" data-lectura-id="${id}" role="tab">Vista de estudio</button>
        </div>
        <div id="vista-lectura-${id}" style="${caja} ${hayLectura ? '' : 'display:none;'}">
          ${hayLectura ? l.vistaLecturaHtml : ''}
        </div>
        <div id="vista-estudio-${id}" style="${caja} ${hayLectura ? 'display:none;' : ''}">
          ${!hayLectura ? '<p style="color:var(--text-muted); font-style:italic;">En esta consulta no se abrió la vista de lectura, por eso solo se guardó la de estudio.</p>' : ''}
          ${l.vistaEstudioHtml || '<span style="color:var(--text-muted);">Sin vista de estudio guardada.</span>'}
        </div>`;
    }

    function _hora(timestamp) {
      if (!timestamp || !timestamp.toDate) return '';
      return ' · ' + timestamp.toDate().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    }

    async function _renderHistorial(uid) {
      contenido.innerHTML = `<p style="text-align:center; color: var(--text-muted);"><i class="ph ph-spinner" aria-hidden="true"></i> Cargando tu historial…</p>`;

      let lecturas;
      try {
        lecturas = await getHistorialUsuario(uid);
      } catch (err) {
        console.error('[historial] Error cargando lecturas:', err);
        contenido.innerHTML = `<p style="text-align:center; color: var(--text-muted);"><i class="ph ph-warning-circle" aria-hidden="true"></i> No se pudo cargar el historial.</p>`;
        return;
      }

      if (lecturas.length === 0) {
        contenido.innerHTML = `
          <p style="text-align:center; color: var(--text-muted); padding: var(--space-6) 0;">
            Todavía no guardaste ninguna lectura.<br>
            Desde el resultado de una consulta, usá "Guardar en mi historial".
          </p>`;
        return;
      }

      contenido.innerHTML = lecturas.map(lectura => `
        <div class="lectura-card" data-id="${_esc(lectura.id)}">
          <div class="lectura-card__header" data-toggle="${_esc(lectura.id)}">
            <div>
              <div class="lectura-card__nombre">${_esc(lectura.nombreTirada || 'Lectura')}</div>
              <div class="lectura-card__meta">
                ${_esc(lectura.tradicion === 'rws' ? 'Rider-Waite-Smith' : 'Marsella')}
                · ${lectura.cartas?.length || 0} carta${lectura.cartas?.length === 1 ? '' : 's'}
                · ${_fecha(lectura.timestamp)}${_hora(lectura.timestamp)}
              </div>
            </div>
            <button class="btn-eliminar-lectura" data-eliminar="${_esc(lectura.id)}" type="button">
              <i class="ph ph-x" aria-hidden="true"></i> Borrar
            </button>
          </div>
          <div class="lectura-card__detalle" id="detalle-${_esc(lectura.id)}">
            <h3 style="font-family:'Cinzel',serif; color: var(--secondary); font-size: 0.85rem; margin-bottom: var(--space-2);">Cartas</h3>
            ${(lectura.cartas || []).map(c => `
              <div class="lectura-carta-item">
                <span>${_esc(c.posicion || '')} — ${_esc(c.arcano_es || '')}</span>
                <span style="color: var(--text-muted);">${c.orientacion === 'invertida' ? 'Invertida' : 'Recta'}</span>
              </div>
            `).join('')}

            ${(lectura.combinaciones && lectura.combinaciones.length > 0) ? `
              <h3 style="font-family:'Cinzel',serif; color: var(--secondary); font-size: 0.85rem; margin: var(--space-3) 0 var(--space-2);">Combinaciones</h3>
              ${lectura.combinaciones.map(c => `
                <div class="lectura-comb-item">
                  <strong>${_esc(c.carta1)} + ${_esc(c.carta2)}</strong><br>
                  <span style="color: var(--text-muted);">${_esc(c.interpretacion || '')}</span>
                </div>
              `).join('')}
            ` : ''}

            ${_htmlConsulta(lectura.consulta)}
            ${_htmlVeredicto(lectura)}
          </div>
        </div>
      `).join('');

      contenido.querySelectorAll('[data-toggle]').forEach(header => {
        header.addEventListener('click', (e) => {
          if (e.target.closest('[data-eliminar]')) return;
          const id = header.dataset.toggle;
          document.getElementById(`detalle-${id}`).classList.toggle('abierto');
        });
      });

      contenido.querySelectorAll('[data-vista-hist]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.lecturaId;
          const vista = btn.dataset.vistaHist;
          document.getElementById(`vista-lectura-${id}`).style.display = vista === 'lectura' ? '' : 'none';
          document.getElementById(`vista-estudio-${id}`).style.display = vista === 'estudio' ? '' : 'none';
          contenido.querySelectorAll(`[data-lectura-id="${id}"]`).forEach(b =>
            b.classList.toggle('toggle-vista__btn--activo', b === btn));
        });
      });

      contenido.querySelectorAll('[data-eliminar]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = btn.dataset.eliminar;
          if (!confirm('¿Borrar esta lectura del historial?')) return;
          try {
            await eliminarLectura(uid, id);
            document.querySelector(`.lectura-card[data-id="${id}"]`).remove();
          } catch (err) {
            console.error('[historial] Error borrando lectura:', err);
            alert('No se pudo borrar. Probá de nuevo.');
          }
        });
      });
    }

    onCambioAuth(user => {
      if (user) {
        _renderHistorial(user.uid);
      } else {
        contenido.innerHTML = `
          <p style="text-align:center; color: var(--text-muted); padding: var(--space-6) 0;">
            Iniciá sesión (arriba a la derecha) para ver tu historial de lecturas.
          </p>`;
      }
    });
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
