<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.style.visibility = "hidden";</script>
  <script type="module" src="js/muro-login.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegí tu mazo — El Código de las Cartas</title>
  <meta name="description" content="Elegí el mazo y el modo de lectura para tu consulta de Tarot.">

  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body data-page="introduccion">

  <header class="nav">
    <a href="index.html" class="nav__logo">El Código de las Cartas</a>
    <nav class="nav__links">
      <a href="index.html" class="nav__link">
        <i class="ph ph-house" aria-hidden="true"></i>&nbsp;Inicio
      </a>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <div class="container--narrow">
        <h1 class="page-header__title">Elegí tu mazo</h1>
        <p class="page-header__subtitle">
          Los cuatro mazos disponibles, dos por tradición. La tradición se
          define sola según el mazo que elijas.
        </p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container--narrow">

        <div class="grid-mazos" id="grid-mazos" role="radiogroup" aria-label="Selección de mazo">
          <!-- Los 4 botones se generan por JS a partir de MAZOS (ver script abajo) -->
        </div>

        <hr class="divider">

        <div class="flex-between" style="flex-wrap: wrap; gap: var(--space-3);">
          <div>
            <p style="font-family:'Cinzel',serif; color: var(--secondary); font-size: 0.9rem; margin-bottom: var(--space-1);">
              Modo de lectura
            </p>
            <div class="toggle-modo" role="radiogroup" aria-label="Modo de lectura">
              <button class="btn-modo activo" type="button" data-modo="automatico" aria-pressed="true">
                <i class="ph ph-shuffle" aria-hidden="true"></i> Automático
              </button>
              <button class="btn-modo" type="button" data-modo="manual" aria-pressed="false">
                <i class="ph ph-hand-pointing" aria-hidden="true"></i> Manual
              </button>
            </div>
          </div>

          <button class="btn btn--primary" id="btn-continuar" type="button" disabled>
            Continuar <i class="ph ph-arrow-right" aria-hidden="true"></i>
          </button>
        </div>

      </div>
    </section>
  </main>

  <footer class="section--tight" style="text-align:center; color: var(--text-muted); font-size: 0.8rem;">
    <p>El Código de las Cartas · Tarot de Marsella &amp; Rider-Waite-Smith</p>
  </footer>

  <script type="module">
    import { setMazo, setTradicion, setModo, derivarTradicion, navigateTo } from './js/navigation.js';
    import { getUrlImagen } from './js/images.js';

    // Los 4 mazos — Sección 2.3 del Documento Maestro. Carta de muestra:
    // primer arcano mayor de cada tradición (le-mat / the-fool).
    const MAZOS = [
      { id: 'marst1', nombre: 'Marsella Nicolas Conver', slugMuestra: 'le-mat' },
      { id: 'mars2',  nombre: 'Marsella Arte',           slugMuestra: 'le-mat' },
      { id: 'rwst1',  nombre: 'Rider-Waite & Smith',     slugMuestra: 'the-fool' },
      { id: 'rws2',   nombre: 'Rider Arte',              slugMuestra: 'the-fool' },
    ];

    let mazoElegido = null;
    let modoElegido = 'automatico';

    const grid = document.getElementById('grid-mazos');
    const btnContinuar = document.getElementById('btn-continuar');

    MAZOS.forEach(mazo => {
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.className = 'mazo-opcion';
      boton.dataset.mazo = mazo.id;
      boton.setAttribute('role', 'radio');
      boton.setAttribute('aria-checked', 'false');

      const url = getUrlImagen({ slug: mazo.slugMuestra }, mazo.id, 'icon');

      boton.innerHTML = `
        ${url
          ? `<img src="${url}" alt="" width="60" loading="lazy"
               onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'placeholder-carta placeholder-carta-icon ${mazo.id}'}))">`
          : `<div class="placeholder-carta placeholder-carta-icon ${mazo.id}"><i class="ph ph-cards" aria-hidden="true"></i></div>`
        }
        <span class="mazo-opcion__nombre">${mazo.nombre}</span>
      `;

      boton.addEventListener('click', () => {
        mazoElegido = mazo.id;
        document.querySelectorAll('.mazo-opcion').forEach(el => {
          el.classList.remove('seleccionado');
          el.setAttribute('aria-checked', 'false');
        });
        boton.classList.add('seleccionado');
        boton.setAttribute('aria-checked', 'true');
        btnContinuar.disabled = false;
      });

      grid.appendChild(boton);
    });

    document.querySelectorAll('.btn-modo').forEach(btn => {
      btn.addEventListener('click', () => {
        modoElegido = btn.dataset.modo;
        document.querySelectorAll('.btn-modo').forEach(b => {
          b.classList.remove('activo');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('activo');
        btn.setAttribute('aria-pressed', 'true');
      });
    });

    btnContinuar.addEventListener('click', () => {
      if (!mazoElegido) return;
      const tradicion = derivarTradicion(mazoElegido);
      setMazo(mazoElegido);
      setTradicion(tradicion);
      setModo(modoElegido);
      navigateTo('tipos-lecturas.html');
    });
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
