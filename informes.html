// ---------- Periodos ----------
function primerDia(){

// ---------- Datos ----------

// Cubos para los gráficos: días (semana/mes) o meses (año)
function cubos(m, r){

    const out = []; let d0 = new Date(fd(r.desde).getFullYear(), fd(r.desde).getMonth(), 1);

// ---------- Gráficos (SVG) ----------
const COL_SUENO = ["#5b6bd6", "#8fb4ff", "#c08bf0", "#e0703f"];
