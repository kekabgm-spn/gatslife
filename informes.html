<script>
const PERFILES = ["Mamy","Filha"], CLAVE_PERFIL_ACTIVO = "dietaPerfilActivo";
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"], DIAS_S = ["dom","lun","mar","mié","jue","vie","sáb"], LET = ["L","M","X","J","V","S","D"];

const MED_CINTA = [["cintura","Cintura"],["abdomenBajo","Abdomen bajo"],["caderas","Caderas"],["pecho","Pecho"],["biceps","Brazo"],["muslo","Muslo"],["pantorrilla","Pantorrilla"]];
const COMP = [["grasaPct","Grasa (%)"],["musculoEsqKg","Músculo esquelético (kg)"]];
let perfil = (function(){ const p = localStorage.getItem(CLAVE_PERFIL_ACTIVO); return PERFILES.includes(p) ? p : PERFILES[0]; })();
let modo = localStorage.getItem("informeModoV1") || "semana"; if(!["dia","semana","mes","anio"].includes(modo)) modo = "semana";
let D = null;

function lj(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function hoyISO(){ return iso(new Date()); }
function fd(f){ return new Date(f + "T00:00:00"); }

let ancla = hoyISO();
const pl = (n, u, v) => n + " " + (n === 1 ? u : v);
const nf = n => String(Math.round(n * 10) / 10).replace(".", ",");
const ni = n => Math.round(n).toLocaleString("es-ES");
const fh = m => { m = Math.round(m); return Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min"; };
const prom = a => { a = a.filter(x => x != null && isFinite(x)); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
const norm = s => String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

// ---------- Periodos ----------
function rango(m, a){
  const d = fd(a);
  if(m === "dia") return { desde: a, hasta: a };
  if(m === "semana"){ const lun = suma(a, -((d.getDay() + 6) % 7)); return { desde: lun, hasta: suma(lun, 6) }; }
  if(m === "mes") return { desde: iso(new Date(d.getFullYear(), d.getMonth(), 1)), hasta: iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  return { desde: d.getFullYear() + "-01-01", hasta: d.getFullYear() + "-12-31" };
}
function mover(m, a, n){
  const d = fd(a);
  if(m === "dia") return suma(a, n);
  if(m === "semana") return suma(a, 7 * n);
  if(m === "mes") return iso(new Date(d.getFullYear(), d.getMonth() + n, 1));
  return iso(new Date(d.getFullYear() + n, 0, 1));
}
function listaDias(desde, hasta){ const r = []; for(let f = desde; f <= hasta; f = suma(f, 1)) r.push(f); return r; }
function etiquetaPeriodo(m, a){
  const r = rango(m, a), d = fd(a), x = fd(r.desde), y = fd(r.hasta);
  if(m === "dia") return DIAS_S[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()] + " " + d.getFullYear();
  if(m === "semana") return x.getDate() + " " + MESES[x.getMonth()] + " – " + y.getDate() + " " + MESES[y.getMonth()] + " " + y.getFullYear();
  if(m === "mes") return MESES[d.getMonth()].toUpperCase() + " " + d.getFullYear();
  return String(d.getFullYear());
}

// ---------- Datos ----------
function cargar(p){
  return { hw: lj("huaweiDiaV1_" + p, {}) || {}, est: lj("dietaDiarioV3_" + p, { meta: null, dias: {} }) || { dias: {} }, med: lj("dietaMedidasV1_" + p, []) || [],
    ej: lj("ejercicioHistorial_" + p, []) || [], pru: lj("saludPruebasV1_" + p, []) || [], metas: lj("perfilMetasV1_" + p, {}) || {} };
}
function infoDia(f){
  const h = D.hw[f] || {}, e = (D.est.dias || {})[f];
  let kcal = 0, gr = 0, ch = 0, pr = 0, n = 0;
  if(e && e.comidas) COMIDAS.forEach(id => (e.comidas[id] || []).forEach(it => { kcal += +it.kcal || 0; gr += +it.grasa || 0; ch += +it.carbh || 0; pr += +it.prot || 0; n++; }));
  const ej = Array.isArray(D.ej) ? D.ej.filter(x => x && x.fecha === f) : [];
  let min = 0, ek = 0; ej.forEach(x => { min += parseFloat(x.minutos) || 0; if(typeof x.kcal === "number" && x.kcal >= 0) ek += x.kcal; });
  return { f, pasos: h.pasos > 0 ? h.pasos : null, sueno: h.sueno && h.sueno.min > 0 ? h.sueno : null, fc: h.fc && h.fc.med > 0 ? h.fc : null, spo2: h.spo2 && h.spo2.med > 0 ? h.spo2 : null,
    kcal: n ? Math.round(kcal) : null, gr: n ? gr : null, ch: n ? ch : null, pr: n ? pr : null, nal: n, ejMin: min, ejN: ej.length, ejKcal: ek, quem: (e && +e.quemadas) || 0 };
}
// Cubos para los gráficos: días (semana/mes) o meses (año)
function cubos(m, r){
  if(m === "anio"){
    return MESES.map((mm, i) => { const ini = r.desde.slice(0, 4) + "-" + String(i + 1).padStart(2, "0") + "-01", fin = iso(new Date(+r.desde.slice(0, 4), i + 1, 0));
      return { etq: mm, dias: listaDias(ini, fin).map(infoDia) }; });
  }
  return listaDias(r.desde, r.hasta).map((f, i) => ({ etq: m === "semana" ? LET[i] : String(fd(f).getDate()), dias: [infoDia(f)] }));
}
const dd = (c, k) => c.dias.map(x => x[k]);
function resumen(m, a){
  const r = rango(m, a), dias = listaDias(r.desde, r.hasta).map(infoDia);
  const g = k => dias.map(x => x[k]).filter(v => v != null);
  const s = dias.filter(x => x.sueno);
  return { r, dias, nDias: dias.length,
    pasos: prom(g("pasos")), nPasos: g("pasos").length,
    sMin: prom(s.map(x => x.sueno.min)), sDeep: prom(s.map(x => x.sueno.deep)), sLight: prom(s.map(x => x.sueno.light)), sRem: prom(s.map(x => x.sueno.rem)), sAwake: prom(s.map(x => x.sueno.awake)), nSueno: s.length,
    fc: prom(dias.filter(x => x.fc).map(x => x.fc.med)), fcMin: Math.min(...dias.filter(x => x.fc).map(x => x.fc.min).concat([Infinity])), fcMax: Math.max(...dias.filter(x => x.fc).map(x => x.fc.max).concat([-Infinity])), nFc: dias.filter(x => x.fc).length,
    spo2: prom(dias.filter(x => x.spo2).map(x => x.spo2.med)), spo2Min: Math.min(...dias.filter(x => x.spo2).map(x => x.spo2.min).concat([Infinity])), nSpo2: dias.filter(x => x.spo2).length,
    kcal: prom(g("kcal")), nKcal: g("kcal").length, gr: prom(g("gr")), ch: prom(g("ch")), pr: prom(g("pr")),
    ejMin: dias.reduce((t, x) => t + x.ejMin, 0), ejN: dias.reduce((t, x) => t + x.ejN, 0), ejDias: dias.filter(x => x.ejN > 0).length, ejKcal: dias.reduce((t, x) => t + x.ejKcal, 0) };
}

// ---------- Gráficos (SVG) ----------
const COL_SUENO = ["#5b6bd6", "#8fb4ff", "#c08bf0", "#e0703f"];
function barras(vals, etqs, o){
  o = o || {}; const W = 320, H = 118, pl = 2, pb = 16, pt = 10, n = vals.length, bw = (W - pl * 2) / n, hh = H - pb - pt;
  const tot = v => Array.isArray(v) ? v.reduce((s, x) => s + (x || 0), 0) : (v || 0);
  const mx = Math.max(o.meta || 0, ...vals.map(tot), 1) * 1.08; let s = '<svg class="gr" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  s += '<line x1="0" y1="' + (H - pb) + '" x2="' + W + '" y2="' + (H - pb) + '" stroke="var(--line)"/>';
  vals.forEach((v, i) => {
    const x = pl + i * bw + bw * 0.15, w = bw * 0.7; let y0 = H - pb;
    if(Array.isArray(v)){ v.forEach((p, j) => { if(!p) return; const h = p / mx * hh; y0 -= h; s += '<rect x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + COL_SUENO[j] + '"/>'; }); }
    else if(v){ const h = v / mx * hh; s += '<rect x="' + x.toFixed(1) + '" y="' + (y0 - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + (o.color || "var(--accent)") + '"/>'; }
    if(n <= 12 || i % 5 === 0) s += '<text x="' + (pl + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(etqs[i]) + '</text>';
  });
  if(o.meta){ const y = H - pb - o.meta / mx * hh; s += '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + W + '" y2="' + y.toFixed(1) + '" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="' + (W - 2) + '" y="' + (y - 2).toFixed(1) + '" text-anchor="end">meta</text>'; }
  s += '<text x="2" y="8">' + esc(o.fmt ? o.fmt(mx / 1.08) : Math.round(mx / 1.08)) + '</text></svg>';
  return s;
}
function linea(pts, fmt){
  if(pts.length < 2) return "";
  const W = 320, H = 100, p = 14, xs = pts.map(q => fd(q.f).getTime()), ys = pts.map(q => q.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), ry = (y1 - y0) || 1, rx = (x1 - x0) || 1;
  const X = t => p + (t - x0) / rx * (W - 2 * p), Y = v => H - p - (v - y0) / ry * (H - 2 * p);
  let s = '<svg class="gr" viewBox="0 0 ' + W + ' ' + H + '" role="img"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="' + pts.map(q => X(fd(q.f).getTime()).toFixed(1) + "," + Y(q.y).toFixed(1)).join(" ") + '"/>';
  pts.forEach(q => { s += '<circle cx="' + X(fd(q.f).getTime()).toFixed(1) + '" cy="' + Y(q.y).toFixed(1) + '" r="2.5" fill="var(--accent)"/>'; });
  return s + '<text x="2" y="9">' + fmt(y1) + '</text><text x="2" y="' + (H - 3) + '">' + fmt(y0) + '</text></svg>';
}
function delta(cur, prev, op){
  op = op || {}; if(cur == null || prev == null || !prev) return "";
  const d = (cur - prev) / Math.abs(prev) * 100; if(Math.abs(d) < 1) return '<span class="sub">= que el periodo anterior</span>';
  const bueno = op.masEsBueno == null ? null : (d > 0) === op.masEsBueno, cls = bueno == null ? "" : (bueno ? "d-ok" : "d-up");
  return '<span class="' + cls + '">' + (d > 0 ? "▲" : "▼") + " " + Math.abs(Math.round(d)) + '%</span> <span class="sub">vs periodo anterior</span>';
}
const nombrePeriodoAnt = { dia: "día anterior", semana: "semana anterior", mes: "mes anterior", anio: "año anterior" };

// ---------- Tarjetas ----------
function tarjetaPasos(c, p, cub){
  if(modo === "dia"){ const x = c.dias[0]; return '<div class="card"><h2>👣 Pasos</h2>' + (x.pasos ? '<div class="grande">' + ni(x.pasos) + '</div>' : '<div class="vacio">Sin datos de pasos este día.</div>') + '</div>'; }
  if(!c.nPasos) return '<div class="card"><h2>👣 Pasos</h2><div class="vacio">Sin datos de pasos en este periodo. Sincroniza en Huawei.</div></div>';
  return '<div class="card"><h2>👣 Pasos</h2><div class="cab"><div><span class="grande">' + ni(c.pasos) + '</span> <span class="sub">de media al día · ' + pl(c.nPasos, 'día', 'días') + ' con dato</span></div><div>' + delta(c.pasos, p.pasos, { masEsBueno: true }) + '</div></div>' +
    barras(cub.map(b => prom(dd(b, "pasos"))), cub.map(b => b.etq), { fmt: ni }) + '</div>';
}
function tarjetaSueno(c, p, cub){
  const leg = '<div class="leyenda"><span><i style="background:' + COL_SUENO[0] + '"></i>Profundo</span><span><i style="background:' + COL_SUENO[1] + '"></i>Ligero</span><span><i style="background:' + COL_SUENO[2] + '"></i>REM</span><span><i style="background:' + COL_SUENO[3] + '"></i>Despierto</span></div>';
  if(modo === "dia"){ const x = c.dias[0].sueno; if(!x) return '<div class="card"><h2>😴 Sueño</h2><div class="vacio">Sin datos de sueño esta noche.</div></div>';
    return '<div class="card"><h2>😴 Sueño</h2><div class="grande">' + fh(x.min) + '</div><div class="tiles"><div class="tile"><div class="t">Profundo</div><div class="v">' + fh(x.deep) + '</div></div><div class="tile"><div class="t">Ligero</div><div class="v">' + fh(x.light) + '</div></div><div class="tile"><div class="t">REM</div><div class="v">' + fh(x.rem) + '</div></div><div class="tile"><div class="t">Despierto</div><div class="v">' + fh(x.awake) + '</div></div></div></div>'; }
  if(!c.nSueno) return '<div class="card"><h2>😴 Sueño</h2><div class="vacio">Sin datos de sueño en este periodo.</div></div>';
  return '<div class="card"><h2>😴 Sueño</h2><div class="cab"><div><span class="grande">' + fh(c.sMin) + '</span> <span class="sub">de media · ' + pl(c.nSueno, 'noche', 'noches') + '</span></div><div>' + delta(c.sMin, p.sMin, { masEsBueno: true }) + '</div></div>' +
    '<div class="sub">Profundo ' + fh(c.sDeep) + ' · Ligero ' + fh(c.sLight) + ' · REM ' + fh(c.sRem) + '</div>' +
    barras(cub.map(b => { const s = b.dias.filter(x => x.sueno); return s.length ? [prom(s.map(x => x.sueno.deep)), prom(s.map(x => x.sueno.light)), prom(s.map(x => x.sueno.rem)), prom(s.map(x => x.sueno.awake))] : null; }), cub.map(b => b.etq), { fmt: v => Math.round(v / 60) + " h" }) + leg + '</div>';
}
function tarjetaPulso(c, p, cub){
  if(modo === "dia"){ const x = c.dias[0].fc, o = c.dias[0].spo2; return '<div class="card"><h2>❤️ Pulso y 🫁 oxígeno</h2><div class="tiles"><div class="tile"><div class="t">Pulso medio</div><div class="v">' + (x ? Math.round(x.med) + " ppm" : "–") + '</div><div class="sub">' + (x ? x.min + " – " + x.max : "") + '</div></div><div class="tile"><div class="t">Oxígeno medio</div><div class="v">' + (o ? nf(o.med) + " %" : "–") + '</div><div class="sub">' + (o ? "mínimo " + nf(o.min) + " %" : "") + '</div></div></div></div>'; }
  let s = '<div class="card"><h2>❤️ Pulso</h2>';
  s += c.nFc ? '<div class="cab"><div><span class="grande">' + Math.round(c.fc) + '</span> <span class="sub">ppm de media · rango ' + c.fcMin + " – " + c.fcMax + '</span></div><div>' + delta(c.fc, p.fc) + '</div></div>' + barras(cub.map(b => prom(b.dias.filter(x => x.fc).map(x => x.fc.med))), cub.map(b => b.etq), { color: "#e0567a", fmt: v => Math.round(v) }) : '<div class="vacio">Sin datos de pulso.</div>';
  s += '</div><div class="card"><h2>🫁 Oxígeno (SpO₂)</h2>';
  s += c.nSpo2 ? '<div class="cab"><div><span class="grande">' + nf(c.spo2) + ' %</span> <span class="sub">de media · mínimo ' + nf(c.spo2Min) + ' %</span></div></div>' + barras(cub.map(b => { const v = prom(b.dias.filter(x => x.spo2).map(x => x.spo2.med)); return v ? v - 80 : null; }), cub.map(b => b.etq), { color: "var(--azul)", fmt: v => Math.round(v + 80) + "%" }) : '<div class="vacio">Sin datos de oxígeno.</div>';
  return s + '</div>';
}
function metaKcal(){ return D.est && D.est.meta > 0 ? D.est.meta : null; }
function tarjetaNutri(c, p, cub){
  const meta = metaKcal();
  if(modo === "dia"){ const x = c.dias[0]; if(!x.nal) return '<div class="card"><h2>🍽️ Nutrición</h2><div class="vacio">Sin comidas registradas este día.</div></div>';
    return '<div class="card"><h2>🍽️ Nutrición</h2><div class="grande">' + ni(x.kcal) + ' kcal</div><div class="sub">' + (meta ? "Meta " + ni(meta) + " kcal · " : "") + 'ejercicio +' + ni(x.ejKcal + x.quem) + ' kcal</div><div class="tiles"><div class="tile"><div class="t">Proteínas</div><div class="v">' + Math.round(x.pr) + ' g</div></div><div class="tile"><div class="t">Hidratos</div><div class="v">' + Math.round(x.ch) + ' g</div></div><div class="tile"><div class="t">Grasa</div><div class="v">' + Math.round(x.gr) + ' g</div></div></div></div>'; }
  if(!c.nKcal) return '<div class="card"><h2>🍽️ Nutrición</h2><div class="vacio">Sin comidas registradas en este periodo.</div></div>';
  return '<div class="card"><h2>🍽️ Nutrición</h2><div class="cab"><div><span class="grande">' + ni(c.kcal) + '</span> <span class="sub">kcal de media · ' + c.nKcal + " de " + c.nDias + (c.nDias === 1 ? ' día registrado' : ' días registrados') + (meta ? " · meta " + ni(meta) : "") + '</span></div><div>' + delta(c.kcal, p.kcal) + '</div></div>' +
    '<div class="sub">Media diaria: proteínas ' + Math.round(c.pr) + ' g · hidratos ' + Math.round(c.ch) + ' g · grasa ' + Math.round(c.gr) + ' g</div>' +
    barras(cub.map(b => prom(dd(b, "kcal"))), cub.map(b => b.etq), { meta: meta, fmt: ni }) + '</div>';
}
function tarjetaPeso(c){
  const med = (D.med || []).filter(x => x && x.fecha).sort((a, b) => a.fecha < b.fecha ? -1 : 1), pes = med.filter(x => x.peso > 0);
  const en = med.filter(x => x.fecha >= c.r.desde && x.fecha <= c.r.hasta), enP = en.filter(x => x.peso > 0), ult = pes[pes.length - 1];
  let s = '<div class="card"><h2>⚖️ Peso y medidas</h2>';
  if(!ult) return s + '<div class="vacio">Aún no hay mediciones.</div></div>';
  const ini = D.metas && D.metas.pesoInicial > 0 ? D.metas.pesoInicial : null;
  s += '<div class="cab"><div><span class="grande">' + nf(ult.peso) + ' kg</span> <span class="sub">última medición (' + ult.fecha.slice(8) + "/" + ult.fecha.slice(5, 7) + ')</span></div>' + (ini ? '<div class="sub">' + (ult.peso - ini > 0 ? "+" : "") + nf(ult.peso - ini) + ' kg desde el inicio</div>' : "") + '</div>';
  if(enP.length >= 2){ const a = enP[0], b = enP[enP.length - 1], d = b.peso - a.peso; s += '<div class="sub">En este periodo: ' + nf(a.peso) + ' → ' + nf(b.peso) + ' kg (' + (d > 0 ? "+" : "") + nf(d) + ' kg)</div>' + linea(enP.map(x => ({ f: x.fecha, y: x.peso })), v => nf(v)); }
  else if(enP.length === 1) s += '<div class="sub">1 medición en este periodo.</div>';
  else s += '<div class="sub">Sin mediciones de peso en este periodo.</div>';
  const campos = COMP.concat(MED_CINTA.filter(x => x[0] !== "pantorrilla" || perfil === "Filha")), filas = [];
  campos.forEach(([id, et]) => { const v = en.filter(x => x[id] > 0); if(!v.length) return; const a = v[0][id], b = v[v.length - 1][id]; filas.push('<tr><td>' + et + '</td><td>' + nf(a) + '</td><td>' + nf(b) + '</td><td>' + (v.length > 1 ? (b - a > 0 ? "+" : "") + nf(b - a) : "–") + '</td></tr>'); });
  if(filas.length) s += '<table class="t2"><tr><th>Medida</th><th>Primera</th><th>Última</th><th>Cambio</th></tr>' + filas.join("") + '</table>';
  return s + '</div>';
}
function tarjetaFitness(c, p, cub){
  const hist = (D.ej || []).filter(x => x && x.fecha >= c.r.desde && x.fecha <= c.r.hasta), tipos = {};
  hist.forEach(x => { const t = x.nombre || x.tipo || "otro"; tipos[t] = (tipos[t] || 0) + 1; });
  const top = Object.keys(tipos).sort((a, b) => tipos[b] - tipos[a]).slice(0, 5).map(t => esc(t) + " ×" + tipos[t]).join(" · ");
  if(!c.ejN) return '<div class="card"><h2>🏃 Fitness</h2><div class="vacio">Sin ejercicios registrados en este periodo.</div></div>';
  return '<div class="card"><h2>🏃 Fitness</h2><div class="cab"><div><span class="grande">' + c.ejN + '</span> <span class="sub">' + (c.ejN === 1 ? 'ejercicio' : 'ejercicios') + ' en ' + pl(c.ejDias, 'día', 'días') + ' · ' + fh(c.ejMin) + (c.ejKcal ? " · " + ni(c.ejKcal) + " kcal" : "") + '</span></div><div>' + delta(c.ejMin, p.ejMin, { masEsBueno: true }) + '</div></div>' +
    (top ? '<div class="sub">' + top + '</div>' : "") + (modo === "dia" ? "" : barras(cub.map(b => { const s = b.dias.reduce((t, x) => t + x.ejMin, 0); return s || null; }), cub.map(b => b.etq), { color: "#f0a43a", fmt: v => Math.round(v) + " min" })) + '</div>';
}
function ultimaAnalitica(){
  const l = (D.pru || []).filter(x => x && x.tipo === "analitica" && Array.isArray(x.valores) && x.valores.length).sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
  return l.length ? l[l.length - 1] : null;
}
function estadoVal(x){
  if(x.v != null){ if(x.max != null && x.v > x.max) return "alto"; if(x.min != null && x.v < x.min) return "bajo"; if(x.min != null || x.max != null) return "ok"; }
  return x.e === "alto" || x.e === "bajo" ? x.e : "ok";
}
function fueraDe(a){ return a ? a.valores.filter(x => ["alto", "bajo"].includes(estadoVal(x))) : []; }
function tarjetaAnalitica(){
  const a = ultimaAnalitica(); let s = '<div class="card"><h2>🩸 Última analítica leída</h2>';
  if(!a) return s + '<div class="vacio">Aún no hay analíticas leídas con IA. Hazlo en Salud › Pruebas.</div></div>';
  const f = fueraDe(a);
  s += '<div class="sub">' + a.fecha.slice(8) + "/" + a.fecha.slice(5, 7) + "/" + a.fecha.slice(0, 4) + ' · ' + (f.length ? f.length + " valor" + (f.length === 1 ? "" : "es") + " fuera de rango" : "todo dentro de rango") + '</div>';
  if(f.length) s += '<div class="chips">' + f.map(x => '<span class="chip ' + estadoVal(x) + '">' + esc(x.n) + " " + (estadoVal(x) === "alto" ? "↑" : "↓") + " " + (x.v != null ? nf(x.v) : esc(x.t)) + '</span>').join("") + '</div>';
  return s + '<a class="ir" href="salud.html">Ver detalle en Salud ›</a></div>';
}

// ---------- Avisos (reglas locales, sin IA) ----------
function avisos(c, p){
  const r = [];
  if(c.nSueno >= 3 && c.sMin < 360) r.push(["⚠️", "Duermes de media " + fh(c.sMin) + ": menos de 6 h."]);
  if(c.nSueno >= 3){ const cortas = c.dias.filter(x => x.sueno && x.sueno.min < 300).length; if(cortas >= 2) r.push(["⚠️", cortas + " noches con menos de 5 h de sueño."]); }
  if(c.nSpo2 >= 1 && isFinite(c.spo2Min) && c.spo2Min < 90) r.push(["⚠️", "El oxígeno bajó hasta " + nf(c.spo2Min) + " % en algún momento. Puede ser ruido del reloj; si se repite, coméntalo con tu médico."]);
  if(c.nFc >= 3 && p.nFc >= 3 && p.fc && c.fc > p.fc * 1.1) r.push(["⚠️", "El pulso medio sube un " + Math.round((c.fc / p.fc - 1) * 100) + " % respecto al " + nombrePeriodoAnt[modo] + "."]);
  if(c.nPasos >= 3 && p.nPasos >= 3 && p.pasos && c.pasos < p.pasos * 0.75) r.push(["ℹ️", "Caminas un " + Math.round((1 - c.pasos / p.pasos) * 100) + " % menos que el " + nombrePeriodoAnt[modo] + "."]);
  const meta = metaKcal();
  if(meta && modo !== "dia"){ const por = c.dias.filter(x => x.kcal != null && x.kcal > meta * 1.1).length; if(por >= 3) r.push(["ℹ️", por + " días comiendo más de un 10 % por encima de tu meta (" + ni(meta) + " kcal)."]); }
  if(modo !== "dia"){ const hasta = c.r.hasta < hoyISO() ? c.r.hasta : hoyISO(), trans = listaDias(c.r.desde, hasta).length; if(trans >= 5 && c.nKcal < trans / 2) r.push(["ℹ️", "Solo hay comidas registradas en " + c.nKcal + " de " + trans + " días: las medias de nutrición pueden no ser fiables."]); }
  const f = fueraDe(ultimaAnalitica()); if(f.length) r.push(["🩸", f.length + " valor" + (f.length === 1 ? "" : "es") + " fuera de rango en la última analítica (" + f.slice(0, 3).map(x => esc(x.n)).join(", ") + (f.length > 3 ? "…" : "") + ")."]);
  return r;
}
function tarjetaAvisos(c, p){
  const a = avisos(c, p);
  return '<div class="card"><h2>🔔 Avisos del periodo</h2>' + (a.length ? '<ul class="al">' + a.map(x => "<li>" + x[0] + " " + x[1] + "</li>").join("") + "</ul>" : '<div class="vacio">Nada que destacar con los datos de este periodo.</div>') +
    '<div class="pie">Reglas orientativas calculadas en tu móvil, no un diagnóstico.</div></div>';
}

// ---------- Conclusión con IA (solo cuando la pides; se guarda para no repetir llamadas) ----------
function textoDatos(c, p){
  const L = [], g = (n, v, u) => v != null && isFinite(v) ? n + ": " + nf(v) + (u || "") : null;
  const par = (t, x) => [g("pasos/día", x.pasos), g("sueño medio (min)", x.sMin), x.sMin ? g("profundo (min)", x.sDeep) : null, g("pulso medio", x.fc), g("SpO2 media", x.spo2, " %"), isFinite(x.spo2Min) ? g("SpO2 mínima", x.spo2Min, " %") : null, g("kcal comidas/día", x.kcal), g("proteínas g/día", x.pr), g("hidratos g/día", x.ch), g("grasa g/día", x.gr), x.ejN ? "ejercicios: " + x.ejN + " (" + Math.round(x.ejMin) + " min)" : null].filter(Boolean);
  L.push("PERIODO ACTUAL (" + modo + ", " + c.r.desde + " a " + c.r.hasta + ", días con dato: pasos " + c.nPasos + ", sueño " + c.nSueno + ", comidas " + c.nKcal + "): " + par("a", c).join("; "));
  L.push("PERIODO ANTERIOR: " + (par("b", p).join("; ") || "sin datos"));
  if(metaKcal()) L.push("Meta calórica: " + metaKcal() + " kcal");
  const a = ultimaAnalitica(); if(a){ const f = fueraDe(a); L.push("Última analítica (" + a.fecha + "): " + (f.length ? "fuera de rango: " + f.slice(0, 12).map(x => x.n + " " + (x.v != null ? nf(x.v) : x.t) + " " + x.u + " (ref " + (x.r || "") + ")").join("; ") : "todo en rango")); }
  const av = avisos(c, p).map(x => x[1]); if(av.length) L.push("Avisos locales: " + av.join(" | "));
  return L.join("\n");
}
function claveIA(c){ return "informeIAV1_" + perfil + "|" + modo + "|" + c.r.desde; }
function tarjetaIA(c){
  const g = lj(claveIA(c), null);
  return '<div class="card"><h2>🤖 Conclusión con IA</h2>' + (g && g.texto ? '<div class="ia">' + esc(g.texto) + '</div><div class="pie">Generada el ' + esc(g.fecha) + '. Orientación, no un diagnóstico.</div>' : '<div class="sub">Resume todo el periodo y propone mejoras concretas. Solo se envían cifras agregadas, sin tu nombre.</div>') +
    '<div style="margin-top:10px"><button type="button" class="btn" id="btnIA">' + (g && g.texto ? "🔄 Volver a generar" : "Generar conclusión") + '</button> <span class="sub" id="estIA"></span></div></div>';
}
let iaOcupada = false;
async function generarIA(){
  if(iaOcupada) return;
  if(!window.IAClaves || !IAClaves.tieneGemini()) return avisar("Falta la clave de Gemini. Ponla una vez en ⚙️ Ajustes.");
  const c = resumen(modo, ancla), p = resumen(modo, mover(modo, ancla, -1)), btn = document.getElementById("btnIA"), est = document.getElementById("estIA");
  if(!(c.nPasos + c.nSueno + c.nKcal + c.ejN + c.nFc)) return avisar("No hay datos en este periodo para analizar.");
  iaOcupada = true; btn.disabled = true; est.textContent = "Pensando…";
  const prompt = "Eres un asistente de bienestar para una persona adulta que sigue su salud en una app familiar. Con los datos agregados de abajo, escribe en español sencillo: 1) un resumen de 4 a 6 frases de cómo fue el periodo (sueño, actividad, alimentación, pulso, oxígeno), destacando lo que cambió respecto al periodo anterior; 2) tres sugerencias concretas y realistas para el próximo periodo; 3) si hay valores de analítica fuera de rango, recuerda que debe comentarlos con su médico, sin interpretarlos como diagnóstico. No diagnostiques, no indiques medicación ni suplementos y no inventes datos que no estén en el texto. Si faltan datos, dilo. Máximo 220 palabras, sin títulos ni listas largas.\n\nDATOS:\n" + textoDatos(c, p);
  try{
    const t = await IAClaves.geminiTexto(prompt);
    if(!t) throw new Error("La IA no devolvió texto. Prueba otra vez.");
    localStorage.setItem(claveIA(c), JSON.stringify({ texto: t.slice(0, 2500), fecha: hoyISO() }));
    iaOcupada = false; pintar();
  }catch(e){ iaOcupada = false; btn.disabled = false; est.textContent = "⚠️ " + (e && e.message ? e.message : "No se pudo generar."); }
}

// ---------- Pintar ----------
function pintar(){
  const r = rango(modo, ancla), c = resumen(modo, ancla), p = resumen(modo, mover(modo, ancla, -1)), cub = modo === "dia" ? [] : cubos(modo, r);
  document.getElementById("etq").textContent = etiquetaPeriodo(modo, ancla);
  document.getElementById("sig").disabled = r.hasta >= hoyISO();
  document.querySelectorAll("#tabsPerfil button").forEach(b => b.classList.toggle("on", b.dataset.perfil === perfil));
  document.querySelectorAll("#tabsModo button").forEach(b => b.classList.toggle("on", b.dataset.modo === modo));
  document.getElementById("informe").innerHTML = tarjetaAvisos(c, p) + tarjetaIA(c) + tarjetaSueno(c, p, cub) + tarjetaPasos(c, p, cub) + tarjetaPulso(c, p, cub) + tarjetaNutri(c, p, cub) + tarjetaPeso(c) + tarjetaFitness(c, p, cub) + tarjetaAnalitica();
  const b = document.getElementById("btnIA"); if(b) b.onclick = generarIA;
}
function refrescarDatos(){ D = cargar(perfil); pintar(); }
document.querySelectorAll("#tabsPerfil button").forEach(b => b.onclick = () => { perfil = b.dataset.perfil; try{ localStorage.setItem(CLAVE_PERFIL_ACTIVO, perfil); }catch(e){} refrescarDatos(); });
document.querySelectorAll("#tabsModo button").forEach(b => b.onclick = () => { modo = b.dataset.modo; try{ localStorage.setItem("informeModoV1", modo); }catch(e){} pintar(); });
document.getElementById("ant").onclick = () => { ancla = mover(modo, ancla, -1); pintar(); };
document.getElementById("sig").onclick = () => { const n = mover(modo, ancla, 1); if(rango(modo, n).desde <= hoyISO()) { ancla = n; pintar(); } };
// La nube puede traer datos nuevos después de abrir la página
window.addEventListener("storage", () => { if(!iaOcupada) refrescarDatos(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden && !iaOcupada) refrescarDatos(); });
refrescarDatos();
