<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.style.visibility = "hidden";</script>
  <script type="module" src="js/muro-login.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiradas — El Código de las Cartas</title>

  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Igual que en tipos-lecturas.html: si se repite una tercera vez,
       se promueve a components.css (Sección 10.1). */
    .buscador-tiradas {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--bg-card);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 6px;
      padding: 0 var(--space-3);
      margin-bottom: var(--space-4);
    }
    .buscador-tiradas input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.95rem;
      height: 44px;
    }
    .grid-tiradas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-3);
    }
    .tirada-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-3);
      background: var(--bg-card);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .tirada-card:hover {
      border-color: rgba(201, 168, 76, 0.5);
      transform: translateY(-2px);
    }
    .tirada-card__nombre {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.3;
    }
    .tirada-card__meta {
      font-size: 0.75rem;
      color: var(--secondary);
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body data-page="listado-tiradas">

  <header class="nav">
    <a href="index.html" class="nav__logo">El Código de las Cartas</a>
    <nav class="nav__links">
      <a href="tipos-lecturas.html" class="nav__link">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>&nbsp;Temas
      </a>
      <a href="index.html" class="nav__link">
        <i class="ph ph-house" aria-hidden="true"></i>&nbsp;Inicio
      </a>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <div class="container--narrow">
        <h1 class="page-header__title" id="titulo-tema">Tiradas</h1>
        <p class="page-header__subtitle" id="subtitulo"></p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">

        <div class="buscador-tiradas">
          <i class="ph ph-magnifying-glass" aria-hidden="true" style="color: var(--text-muted);"></i>
          <input type="text" id="buscador" placeholder="Buscar por nombre de tirada…" autocomplete="off">
        </div>

        <div class="grid-tiradas" id="grid-tiradas" aria-live="polite">
          <p style="color: var(--text-muted);">
            <i class="ph ph-spinner" aria-hidden="true"></i> Cargando tiradas…
          </p>
        </div>

      </div>
    </section>
  </main>

  <footer class="section--tight" style="text-align:center; color: var(--text-muted); font-size: 0.8rem;">
    <p>El Código de las Cartas · Tarot de Marsella &amp; Rider-Waite-Smith</p>
  </footer>

  <script type="module">
    import { getTradicion, getUrlParam, navigateTo } from './js/navigation.js';

    const TEMA_NOMBRES = {
      amor: 'Amor y vínculos',
      trabajo_dinero: 'Trabajo y dinero',
      familia_hogar: 'Familia y hogar',
      salud_bienestar: 'Salud y bienestar',
      decisiones_elecciones: 'Decisiones',
      crisis_transformacion: 'Crisis y transformación',
      espiritualidad_crecimiento: 'Espiritualidad',
      creatividad_proyectos: 'Creatividad y proyectos',
      viajes_mudanzas: 'Viajes y mudanzas',
      consultas_generales: 'Consultas generales',
    };

    const grid = document.getElementById('grid-tiradas');
    const buscador = document.getElementById('buscador');
    const titulo = document.getElementById('titulo-tema');
    const subtitulo = document.getElementById('subtitulo');

    let todasLasTiradas = [];

    function render(lista) {
      grid.innerHTML = '';
      if (lista.length === 0) {
        grid.innerHTML = `<p style="color: var(--text-muted);">Ninguna tirada coincide con la búsqueda.</p>`;
        return;
      }
      lista.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tirada-card';
        btn.innerHTML = `
          <span class="tirada-card__nombre">${t.nombre_tirada}</span>
          <span class="tirada-card__meta">${t.num_cartas} carta${t.num_cartas === 1 ? '' : 's'}</span>
        `;
        btn.addEventListener('click', () => {
          navigateTo(`detalle-tirada.html?id=${encodeURIComponent(t.id_tirada)}`);
        });
        grid.appendChild(btn);
      });
    }

    async function init() {
      const tradicion = getTradicion();
      const tema = getUrlParam('tema');

      if (!tradicion) {
        navigateTo('introduccion.html');
        return;
      }
      // Sin caso de recovery documentado para esta página en la Sección
      // 5.3 — mismo criterio aplicado en tipos-lecturas.html: sin tema,
      // no hay grid que mostrar (la página se diseñó para llegar con
      // ?tema= desde tipos-lecturas.html).
      if (!tema) {
        navigateTo('tipos-lecturas.html');
        return;
      }

      titulo.textContent = TEMA_NOMBRES[tema] || tema;

      try {
        const dataModule = tradicion === 'rws'
          ? await import('./js/data-rws.js')
          : await import('./js/data-marsella.js');

        todasLasTiradas = await dataModule.getTiradas(tema);
        subtitulo.textContent = `${todasLasTiradas.length} tirada${todasLasTiradas.length === 1 ? '' : 's'} disponible${todasLasTiradas.length === 1 ? '' : 's'}.`;
        render(todasLasTiradas);

      } catch (err) {
        console.error('[listado-tiradas] Error cargando tiradas:', err);
        grid.innerHTML = `
          <p style="color: var(--text-muted);">
            <i class="ph ph-warning-circle" aria-hidden="true"></i>
            No se pudieron cargar las tiradas. Probá recargar la página.
          </p>
        `;
      }
    }

    buscador.addEventListener('input', () => {
      const q = buscador.value.trim().toLowerCase();
      const filtradas = q
        ? todasLasTiradas.filter(t => t.nombre_tirada.toLowerCase().includes(q))
        : todasLasTiradas;
      render(filtradas);
    });

    init();
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
