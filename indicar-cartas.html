<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.style.visibility = "hidden";</script>
  <script type="module" src="js/muro-login.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indica tus cartas — El Código de las Cartas</title>

  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* ⚠️ Corrección 13/8/2026: este bloque tenía 16 clases duplicadas
       (selector-grupo, selector-carta, panel-titulo, posicion-item, etc.)
       que YA estaban definidas en components.css con mejor diseño que mi
       primera versión (ej. .selector-carta con flecha SVG custom,
       .posicion-item con grid propio) — las mías las estaban pisando.
       Verificado contra el archivo completo (1466 líneas). Solo quedan
       acá las 2 clases que de verdad no existían en ningún lado. */
    .layout-indicar {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-4);
      align-items: start;
    }
    @media (max-width: 720px) {
      .layout-indicar {
        grid-template-columns: 1fr;
      }
    }
    .panel-posiciones {
      background: var(--bg-card);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 8px;
      padding: var(--space-3);
      position: sticky;
      top: var(--space-3);
    }
    #accion-confirmar {
      text-align: center;
      margin-top: var(--space-3);
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body data-page="indicar-cartas">

  <header class="nav">
    <a href="index.html" class="nav__logo">El Código de las Cartas</a>
    <nav class="nav__links">
      <a href="tipos-lecturas.html" id="nav-volver-tirada" class="nav__link">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>&nbsp;Volver
      </a>
      <a href="index.html" class="nav__link">
        <i class="ph ph-house" aria-hidden="true"></i>&nbsp;Inicio
      </a>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <div class="container--narrow">
        <a href="tipos-lecturas.html" id="breadcrumb-tirada-link"
           style="display:inline-block; color: var(--text-muted); font-size: 0.8rem; margin-bottom: var(--space-2);">
          Tirada
        </a>
        <h1 class="page-header__title" id="nombre-posicion">Cargando…</h1>
        <p class="page-header__subtitle" id="descripcion-posicion"></p>
        <p style="margin-top: var(--space-2);">
          <a href="guia-practica-tirada.html" style="color: var(--secondary); font-size: 0.85rem; text-decoration: none;">
            <i class="ph ph-book-open-text" aria-hidden="true"></i>&nbsp;¿Primera vez? Guía práctica antes de tirar
          </a>
        </p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div id="progreso-seleccion"></div>

        <div class="layout-indicar">
          <aside class="panel-posiciones" id="panel-posiciones"></aside>

          <div>
            <div id="controles-selector"></div>
            <div id="grid-seleccion"></div>
            <div id="accion-confirmar"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="section--tight" style="text-align:center; color: var(--text-muted); font-size: 0.8rem;">
    <p>El Código de las Cartas · Tarot de Marsella &amp; Rider-Waite-Smith</p>
  </footer>

  <script type="module" src="js/selection.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
