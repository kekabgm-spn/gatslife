<style>
  :root{
    --bg: #10151f;
    --panel: #1b2330;
    --panel-alt: #232c3b;
    --ink: #eef2f6;
    --muted: #8a94a3;
    --accent: #35c26a;
    --accent-soft: rgba(53,194,106,0.15);
    --warn: #e0703f;
    --line: #2a3242;
  }
  :root[data-theme="light"]{
    --bg: #f4f6f8;
    --panel: #ffffff;
    --panel-alt: #eef1f5;
    --ink: #1b2330;
    --muted: #667085;
    --accent: #1f9d52;
    --accent-soft: rgba(31,157,82,0.12);
    --warn: #c8562e;
    --line: #d7dce3;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px 14px 80px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:1.3rem;margin:0 0 4px;font-weight:700;}
  .subfecha{color:var(--muted);font-size:0.85rem;margin-bottom:16px;text-transform:capitalize;}

  .tabs-lista{display:flex;gap:6px;margin-bottom:16px;}
  .tabs-lista button{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:9px;border-radius:8px;font-size:0.88rem;cursor:pointer;font-weight:600;
  }
  .tabs-lista button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  .filtro-zona{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .filtro-zona label{color:var(--muted);font-size:0.82rem;}
  .filtro-zona select{
    flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--ink);font-size:0.88rem;
  }

  .franja{margin-bottom:18px;}
  .franja-titulo{font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin:0 0 8px 4px;}
  .empty-franja{color:var(--muted);font-size:0.85rem;font-style:italic;padding:4px;}

  .tarea{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  }
  .tarea.completada{opacity:0.55;}
  .tarea.completada .tarea-nombre{text-decoration:line-through;}
  .tarea-check{
    width:24px;height:24px;border-radius:50%;border:2px solid var(--line);
    background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:0.9rem;
  }
  .tarea-check.on{background:var(--accent);border-color:var(--accent);color:#0a1f14;}
  .tarea-info{flex:1;min-width:0;}
  .tarea-nombre{font-weight:600;font-size:0.95rem;}
  .tarea-meta{color:var(--muted);font-size:0.75rem;margin-top:2px;}
  .tarea-borrar{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;flex-shrink:0;}
  .tarea-borrar:hover{color:var(--warn);}
  .tarea-reloj{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.05rem;flex-shrink:0;}
  .tarea-reloj:hover, .tarea-reloj.activo{color:var(--accent);}

  .timer-row{
    display:flex;align-items:center;gap:8px;background:var(--panel-alt);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:-2px 0 8px 0;
  }
  .timer-row input{
    width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);text-align:center;font-size:0.9rem;
  }
  .timer-row button{
    background:var(--accent);color:#0a1f14;border:none;border-radius:6px;
    padding:6px 10px;font-size:0.82rem;font-weight:700;cursor:pointer;
  }
  .timer-row button.timer-cerrar{background:transparent;border:1px solid var(--line)!important;color:var(--muted);}
  .timer-row .timer-restante{
    font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-size:1.05rem;min-width:48px;
  }
  .timer-row .timer-label{color:var(--muted);font-size:0.8rem;}

  .btn-nueva{
    width:100%;background:var(--accent);color:#0a1f14;border:none;border-radius:10px;
    padding:13px;font-size:0.95rem;font-weight:700;cursor:pointer;margin-top:6px;
  }

  .form-tarea{
    background:var(--panel-alt);border:1px solid var(--line);border-radius:10px;
    padding:16px;margin-top:10px;
  }
  .form-tarea label{font-size:0.8rem;color:var(--muted);display:block;margin:12px 0 6px;}
  .form-tarea label:first-child{margin-top:0;}
  .form-tarea input[type=text], .form-tarea select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:0.92rem;
  }
  .grupo-radio{display:flex;gap:6px;}
  .grupo-radio button{
    flex:1;background:var(--bg);border:1px solid var(--line);color:var(--muted);
    padding:8px 4px;border-radius:8px;font-size:0.82rem;cursor:pointer;
  }
  .grupo-radio button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700;}
  .sub-opcion{display:none;}
  .sub-opcion.show{display:block;}
  .form-acciones{display:flex;gap:8px;margin-top:16px;}
  .form-acciones button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;font-size:0.9rem;cursor:pointer;}
  .form-acciones .guardar{background:var(--accent);color:#0a1f14;}
  .form-acciones .cancelar{background:transparent;border:1px solid var(--line)!important;color:var(--muted);}

  .aviso{font-size:0.78rem;color:var(--muted);text-align:center;margin-top:26px;line-height:1.5;}
  .timer-row{flex-wrap:wrap;}
  .timer-row button.pos-hoy, .timer-row button.modo-opc, .timer-row button.modo-cong{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
  .tarea-posponer{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.05rem;flex-shrink:0;}
  .tarea-posponer:hover, .tarea-posponer.activo{color:var(--warn);}
  .franja-titulo.plegable{display:flex;justify-content:space-between;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px 0;font-size:0.85rem;}
  .filtros-fila{display:flex;gap:8px;margin-bottom:10px;}
  .tarea.opcional{border-style:dashed;}
  .timer-row select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:0.82rem;}
  .tarea.congelada{opacity:0.6;}
  .filtros-fila select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:0.88rem;}

  .navapp{display:flex;gap:4px;margin:0 0 14px;background:#1b2330;border:1px solid #2a3242;border-radius:10px;padding:4px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .navapp a{flex:1;text-align:center;padding:9px 2px;border-radius:7px;color:#8a94a3;text-decoration:none;font-size:0.7rem;font-weight:800;letter-spacing:.02em;}
  .navapp a[aria-current="page"]{background:rgba(53,194,106,0.15);color:#35c26a;}
</style>

<script>
const CLAVE = "tareasKokuk_v1";
let listaActiva = "casa";

function hoyISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function diaSemana(){
  return new Date().toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long"});
}

function cargarEstado(){
  try{
    const raw = localStorage.getItem(CLAVE);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { tareas: [] };
}
function guardarEstado(){
  localStorage.setItem(CLAVE, JSON.stringify(estado));
  if(window.Familia && window.Familia.listo){
    window.Familia.guardarCasa(estado.tareas.filter(t=>t.lista==="casa"||t.lista==="invitadas"));
  }
}
let estado = cargarEstado();

// ---------- Lista de casa: ayudas de la semilla (arriba, para estar listas cuando llegue la nube) ----------
const SEMILLA_V1 = "tareasCasaSembradas_v1", SEMILLA_V2 = "tareasCasaSembradas_v2";
function esSemillaVieja(t){ return String(t.id).startsWith("casa_seed_"); }
function esSemillaNueva(t){ return String(t.id).startsWith("casa_seed50_"); }
function tareaDeSemilla(f, i){
  return { id:"casa_seed50_"+i, nombre:f.nombre, lista:"casa", zona:f.zona, tipo:"repetitiva", franja:null,
           frecuencia:f.frecuencia, reseteo:f.reseteo, completadaPor:{Mamy:false,Filha:false}, historialPor:{Mamy:[],Filha:[]} };
}

// ---------- Fase 2: conectar la lista de Casa compartida en cuanto esté lista la conexión ----------
let familiaCasaConectada = false;
function conectarCasaCompartida(){
  if(familiaCasaConectada || !window.Familia || !window.Familia.listo) return;
  familiaCasaConectada = true;
  let primeraVez = true;
  window.Familia.escucharCasa((tareasCasaNube)=>{
    if(primeraVez && tareasCasaNube.length===0){
      // Todavía no existe el documento compartido: esta cuenta "siembra" la nube con lo que ya tenía localmente.
      ampliarTareasCasa();
      const casaLocal = estado.tareas.filter(t=>t.lista==="casa"||t.lista==="invitadas").map(t=>{
        const t2 = Object.assign({}, t);
        if(t2.completada !== undefined){ t2.completadaPor = { Mamy:false, Filha:false, [miPerfil()]: t2.completada }; delete t2.completada; }
        if(t2.historial !== undefined){ t2.historialPor = { Mamy:[], Filha:[], [miPerfil()]: t2.historial }; delete t2.historial; }
        return t2;
      });
      if(casaLocal.length){ window.Familia.guardarCasa(casaLocal); }
    } else {
      estado.tareas = estado.tareas.filter(t=>t.lista!=="casa").concat(tareasCasaNube);
      if(estado.tareas.some(esSemillaVieja)){
        reducirTareasCasa(true); // la nube todavía tenía las 287 antiguas: se reemplazan por las 50 y se suben a la nube
      } else {
        if(ampliarTareasCasa()) guardarEstado(); // añade las tareas nuevas una sola vez y las sube a la nube
        else localStorage.setItem(CLAVE, JSON.stringify(estado));
        render();
      }
    }
    primeraVez = false;
  });
}
window.addEventListener("familia-casa-lista", conectarCasaCompartida);
if(window.Familia && window.Familia.listo) conectarCasaCompartida();

// ---------- Invitaciones a tareas puntuales (fuera de Casa) ----------
let invitaciones = [];
let familiaInvitacionesConectada = false;
function conectarInvitaciones(){
  if(familiaInvitacionesConectada || !window.Familia || !window.Familia.listo) return;
  familiaInvitacionesConectada = true;
  window.Familia.escucharInvitaciones((items)=>{
    invitaciones = items;
    renderBandejaInvitaciones();
  });
}
window.addEventListener("familia-invitaciones-lista", conectarInvitaciones);
if(window.Familia && window.Familia.listo) conectarInvitaciones();

function crearInvitacion(nombre){
  const p = miPerfil();
  if(!p){ alert("Todavía no se identificó tu cuenta — esperá unos segundos y probá de nuevo."); return; }
  const otra = laOtra();
  invitaciones.push({
    id: "inv" + Date.now(), nombre, creadoPor: p, destinatario: otra, estado: "pendiente"
  });
  window.Familia.guardarInvitaciones(invitaciones);
  renderBandejaInvitaciones();
}
function responderInvitacion(id, aceptar){
  const inv = invitaciones.find(i=>i.id===id);
  if(!inv) return;

    invitaciones = invitaciones.filter(i=>i.id!==id);

  window.Familia.guardarInvitaciones(invitaciones);
  renderBandejaInvitaciones();
  render();
}

// --- Temporizador configurable ---
// Vive solo mientras la app está abierta en esta pestaña: si cerrás el navegador, se pierde.
// (Igual que las tareas en sí, esto no se guarda todavía porque no hay sincronización real.)
let timers = {};        // id de tarea -> segundos restantes
let timerAbiertoEn = null; // id de tarea cuyo panel "elegir minutos" está abierto

function sonarAlarma(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    [0, 0.45, 0.9].forEach(t=>{
      gain.gain.setValueAtTime(0.35, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.35);
    });
    osc.stop(ctx.currentTime + 1.3);
  }catch(e){}
}

function iniciarTimer(id, minutos){
  if(!minutos || minutos<=0){ alert("Escribí un número de minutos mayor que cero."); return; }
  if("Notification" in window && Notification.permission === "default"){
    Notification.requestPermission();
  }
  timers[id] = Math.round(minutos*60);
  timerAbiertoEn = null;
  render();
}
function cancelarTimer(id){
  delete timers[id];
  render();
}

setInterval(()=>{
  Object.keys(timers).forEach(id=>{
    timers[id]--;
    if(timers[id] <= 0){
      const t = estado.tareas.find(x=>x.id===id);
      sonarAlarma();
      if("Notification" in window && Notification.permission === "granted"){
        new Notification("⏱️ ¡Tiempo cumplido!", { body: t ? t.nombre : "Temporizador" });
      }
      delete timers[id];
      render();
    } else {
      const span = document.querySelector(`.timer-restante[data-id="${id}"]`);
      if(span){
        const m = Math.floor(timers[id]/60), s = timers[id]%60;
        span.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
      }
    }
  });
}, 1000);

// Una tarea:
// { id, nombre, lista: "casa"|"Mamy"|"Filha", tipo: "simple"|"horario"|"repetitiva",
//   franja: "mañana"|"mediodia"|"tarde"|null,
//   zona: string|null,  -> zona de la casa (solo se usa para agrupar/filtrar la lista "casa")
//   frecuencia: "diaria"|"semanal"|"quincenal"|"mensual"|"trimestral"|"semestral"|"anual"|null,
//   reseteo: "auto"|"manual"|null,
//   completada: bool,            -> usado tal cual para simple/horario y para repetitivas con reseteo "manual"
//   historial: ["2026-09-18", ...]  -> usado para repetitivas con reseteo "auto"
// }

function inicioSemanaISO(fISO){
  const d = new Date(fISO+"T00:00:00");
  const diaSemana = (d.getDay()+6)%7; // 0=lunes
  d.setDate(d.getDate()-diaSemana);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// El "período" es la unidad de tiempo que hay que completar una vez.
// Cada frecuencia define su propio período: diaria = el día; semanal = la semana (lunes a lunes);
// quincenal = la primera o segunda mitad del mes; mensual = el mes; trimestral = cada 3 meses del año;
// semestral = cada 6 meses del año; anual = el año.
function periodoActual(t){
  const hoy = hoyISO();
  const d = new Date(hoy+"T00:00:00");
  const anio = d.getFullYear();
  const mes = d.getMonth()+1;
  switch(t.frecuencia){
    case "semanal": return inicioSemanaISO(hoy);
    case "quincenal": return anio+"-"+String(mes).padStart(2,"0")+"-"+(d.getDate()<=15 ? "Q1" : "Q2");
    case "mensual": return anio+"-"+String(mes).padStart(2,"0");
    case "trimestral": return anio+"-T"+Math.ceil(mes/3);
    case "semestral": return anio+"-S"+Math.ceil(mes/6);
    case "anual": return String(anio);
    default: return hoy; // diaria
  }
}

function miPerfil(){ return (window.Familia && window.Familia.perfil) || null; }
function laOtra(){ const m = miPerfil(); return m==="Mamy" ? "Filha" : m==="Filha" ? "Mamy" : null; }

function estaCompletadaHoy(t){
  if(t.lista === "casa" || t.lista === "invitadas"){
    // Casa es de las dos: se cuenta "hecha" solo cuando ambas la marcaron. Si falta una, queda "a medias".
    const periodo = (t.tipo==="repetitiva" && t.reseteo==="auto") ? periodoActual(t) : null;
    const mamy = hechaPorPersona(t,"Mamy",periodo), filha = hechaPorPersona(t,"Filha",periodo);
    return t.unaBasta ? (mamy || filha) : (mamy && filha); // unaBasta: con que la haga una de las dos ya cuenta como hecha
  }
  if(t.tipo === "repetitiva" && t.reseteo === "auto"){
    return (t.historial||[]).includes(periodoActual(t));
  }
  return !!t.completada;
}
function hechaPorPersona(t, persona, periodo){
  if(periodo !== null){
    return !!(t.historialPor && t.historialPor[persona] && t.historialPor[persona].includes(periodo));
  }
  return !!(t.completadaPor && t.completadaPor[persona]);
}
function estaHechaPorMi(t){ const p = miPerfil(); return p ? hechaPorPersona(t, p, (t.tipo==="repetitiva"&&t.reseteo==="auto") ? periodoActual(t) : null) : false; }
function estaHechaPorLaOtra(t){ const p = laOtra(); return p ? hechaPorPersona(t, p, (t.tipo==="repetitiva"&&t.reseteo==="auto") ? periodoActual(t) : null) : false; }

// Registro de lo hecho: cada vez que se marca una tarea se anota día, hora y persona (viaja con la propia tarea y su sincronización)
function anotarRegistro(t, quien, hecho){
  t.registro = Array.isArray(t.registro) ? t.registro : [];
  const hoy = hoyISO();
  if(hecho){
    const d = new Date();
    t.registro.push({ f: hoy, h: String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"), p: quien || "?" });
    if(t.registro.length > 80) t.registro = t.registro.slice(-80);
  } else {
    for(let i = t.registro.length-1; i >= 0; i--){ if(t.registro[i].f === hoy && t.registro[i].p === (quien || "?")){ t.registro.splice(i,1); break; } }
  }
}
function marcarCompletada(t){
  let marcado = null;
  delete t.pospuestaHasta;
  if(t.lista === "casa" || t.lista === "invitadas"){
    const p = miPerfil();
    if(!p){ alert("Todavía no se identificó tu cuenta — esperá unos segundos y probá de nuevo."); return; }
    if(t.tipo === "repetitiva" && t.reseteo === "auto"){
      t.historialPor = t.historialPor || { Mamy:[], Filha:[] };
      t.historialPor[p] = t.historialPor[p] || [];
      const periodo = periodoActual(t);
      const i = t.historialPor[p].indexOf(periodo);
      if(i>=0){ t.historialPor[p].splice(i,1); marcado = false; } else { t.historialPor[p].push(periodo); marcado = true; }
    } else {
      t.completadaPor = t.completadaPor || { Mamy:false, Filha:false };
      t.completadaPor[p] = !t.completadaPor[p]; marcado = t.completadaPor[p];
    }
  } else if(t.tipo === "repetitiva" && t.reseteo === "auto"){
    t.historial = t.historial || [];
    const periodo = periodoActual(t);
    const i = t.historial.indexOf(periodo);
    if(i>=0){ t.historial.splice(i,1); marcado = false; } else { t.historial.push(periodo); marcado = true; }
  } else {
    t.completada = !t.completada; marcado = t.completada;
  }
  if(marcado !== null) anotarRegistro(t, (t.lista==="casa"||t.lista==="invitadas") ? miPerfil() : (t.lista || miPerfil()), marcado);
  guardarEstado();
  render();
}

let filtroEstado = "pendiente"; // pendiente | pospuesta | hecha | todas
let filtroFrec = "";
let abiertas = {};               // secciones desplegadas a mano: clave -> true/false
let posponerAbiertoEn = null;    // id de tarea cuyo panel "posponer" está abierto

function fechaMasDias(dias){
  const d = new Date(hoyISO()+"T00:00:00");
  d.setDate(d.getDate()+Math.round(dias));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// Una tarea está "pospuesta" mientras su fecha de regreso sea posterior a hoy; ese día vuelve sola a pendientes.
const IDS_VISIBLES_SIEMPRE = ["casa_ampl1_7","casa_ampl1_8","casa_ampl1_9"]; // colada: separar y poner lavadora / tender y recoger / doblar y guardar
function esVisibleSiempre(t){ return !!t.visibleSiempre || IDS_VISIBLES_SIEMPRE.indexOf(t.id) >= 0; }
function estadoTarea(t){
  if(t.modo==="congelada") return "congelada";
  if(t.pospuestaHasta && t.pospuestaHasta > hoyISO()) return "pospuesta";
  // "Según necesidad": no molesta en Pendientes; se ve en su propio filtro y, al marcarla, queda "hecha" ese día.
  // Excepción: la colada (visibleSiempre) sí se ve en Pendientes, y al día siguiente vuelve a aparecer.
  if(t.tipo==="repetitiva" && t.frecuencia==="necesidad" && !esVisibleSiempre(t)) return estaCompletadaHoy(t) ? "hecha" : "necesidad";
  return estaCompletadaHoy(t) ? "hecha" : "pendiente";
}
function posponer(t, dias){
  if(!dias || dias<=0){ alert("Escribí un número de días mayor que cero."); return; }
  t.pospuestaHasta = fechaMasDias(dias);
  t.veces = (t.veces||0)+1;
  posponerAbiertoEn = null;
  guardarEstado(); render();
}
let visibles = []; // tareas que se ven con los filtros actuales (para las acciones en bloque)
function cambiarModo(t, modo){
  if(modo==="normal") delete t.modo; else t.modo = modo;
  posponerAbiertoEn = null;
  guardarEstado(); render();
}
function cambiarFrecuencia(t, f){
  t.frecuencia = f;
  posponerAbiertoEn = null;
  guardarEstado(); render();
}
function ordenTareas(a,b){
  return (estaCompletadaHoy(a)-estaCompletadaHoy(b)) || ((a.modo==="opcional")-(b.modo==="opcional"));
}
function volverAHoy(t){
  delete t.pospuestaHasta;
  posponerAbiertoEn = null;
  guardarEstado(); render();
}
function crearSeccion(clave, titulo, tareas){
  const k = listaActiva+"|"+clave;
  const abierta = (k in abiertas) ? abiertas[k] : (listaActiva!=="casa" || !!zonaFiltro);
  const sec = document.createElement("div");
  sec.className = "franja";
  const h = document.createElement("div");
  h.className = "franja-titulo plegable";
  h.innerHTML = `<span>${abierta?"▼":"▶"} ${titulo}</span><span>${tareas.length}</span>`;
  h.onclick = ()=>{ abiertas[k] = !abierta; render(); };
  sec.appendChild(h);
  if(abierta) tareas.forEach(t=>pintarTareaEnSeccion(sec, t));
  return sec;
}

function borrarTarea(id){
  estado.tareas = estado.tareas.filter(t=>t.id!==id);
  guardarEstado();
  render();
}

const FRANJAS = [
  {clave:"mañana", label:"Mañana"},
  {clave:"mediodia", label:"Mediodía"},
  {clave:"tarde", label:"Tarde"},

];

const ZONAS = [
  "Gatas","Salón","Habitación 1","Habitación 2","Habitación 3",
  "Baño 1","Baño 2","Pasillo","Cocina","Solana/Lavadero",
  "Ventanas y cristales","Suelos (general)","Basura y reciclaje","Mantenimiento del piso","Orden y organización"
];
let zonaFiltro = ""; // "" = todas las zonas (solo aplica a la pestaña Casa)

function iconoTipo(t){
  if(t.tipo==="repetitiva") return t.reseteo==="auto" ? "🔁" : "↩️";
  if(t.tipo==="horario") return "🕐";
  return "";
}
const FRECUENCIA_LABEL = {
  diaria: "Repite cada día",
  semanal: "Repite cada semana",
  quincenal: "Repite cada quincena",
  mensual: "Repite cada mes",
  trimestral: "Repite cada 3 meses",
  semestral: "Repite cada 6 meses",
  anual: "Repite cada año",
  necesidad: "Según necesidad"
};
const FREC_OPCIONES = [["diaria","Cada día"],["semanal","Cada semana"],["quincenal","Cada 15 días"],["mensual","Cada mes"],["trimestral","Cada 3 meses"],["semestral","Cada 6 meses"],["anual","Cada año"],["necesidad","Según necesidad"]];
function metaTexto(t){
  const partes = [];
  if(t.tipo==="repetitiva"){
    partes.push(FRECUENCIA_LABEL[t.frecuencia] || "Se repite");
    if(t.frecuencia==="necesidad") partes.push("se anota cuando la haces");
    else partes.push(t.reseteo==="auto" ? "se resetea sola" : "la desmarcás a mano");
    if(t.unaBasta) partes.push("basta con una de las dos");
  }
  if(estadoTarea(t)==="pospuesta") partes.push("⏭️ vuelve el "+t.pospuestaHasta.split("-").reverse().slice(0,2).join("/"));
  if(t.modo==="opcional") partes.push("opcional");
  if(t.modo==="congelada") partes.push("❄️ congelada");
  if(t.veces>=2) partes.push("pospuesta "+t.veces+" veces");
  if(t.zona) partes.push(t.zona);
  return partes.join(" · ");
}

function pintarTareaEnSeccion(sec, t){
  const done = estaCompletadaHoy(t);
  const esCasa = t.lista === "casa" || t.lista === "invitadas";
  const miCheck = esCasa ? estaHechaPorMi(t) : done;
  const div = document.createElement("div");
  div.className = "tarea" + (done ? " completada":"") + (t.modo==="opcional" ? " opcional":"") + (t.modo==="congelada" ? " congelada":"");
  const otraTxt = esCasa ? (estaHechaPorLaOtra(t) ? ` <span title="La otra persona ya la marcó" style="color:#35c26a;font-size:0.72rem">✓ ${laOtra()||""}</span>` : ` <span title="La otra persona todavía no la marcó" style="color:var(--muted);font-size:0.72rem">○ ${laOtra()||""}</span>`) : "";
  div.innerHTML = `
    <button type="button" class="tarea-check ${miCheck?"on":""}">${miCheck?"✓":""}</button>
    <div class="tarea-info">
      <div class="tarea-nombre">${iconoTipo(t)} ${t.nombre}${otraTxt}</div>
      ${metaTexto(t) ? `<div class="tarea-meta">${metaTexto(t)}</div>` : ""}
    </div>
    <button type="button" class="tarea-posponer ${estadoTarea(t)==='pospuesta'?"activo":""}" title="Posponer">⏭️</button>
    <button type="button" class="tarea-reloj ${timers[t.id]!==undefined?"activo":""}" title="Temporizador">⏱️</button>
    <button type="button" class="tarea-borrar">✕</button>`;
  div.querySelector(".tarea-check").onclick = ()=>marcarCompletada(t);
  div.querySelector(".tarea-borrar").onclick = ()=>{
    if(confirm(`¿Borrar "${t.nombre}"?`)) borrarTarea(t.id);
  };
  div.querySelector(".tarea-posponer").onclick = ()=>{
    posponerAbiertoEn = (posponerAbiertoEn===t.id) ? null : t.id;
    render();
  };
  div.querySelector(".tarea-reloj").onclick = ()=>{
    timerAbiertoEn = (timerAbiertoEn===t.id) ? null : t.id;
    render();
  };
  sec.appendChild(div);

  if(posponerAbiertoEn === t.id){
    const fila = document.createElement("div");
    fila.className = "timer-row";
    fila.innerHTML = `
      <span class="timer-label">Posponer:</span>
      <button type="button" data-d="1">Mañana</button>
      <button type="button" data-d="3">3 días</button>
      <button type="button" data-d="7">1 semana</button>
      <input type="number" min="1" class="pos-dias" placeholder="días">
      <button type="button" class="pos-ok">OK</button>
      ${estadoTarea(t)==="pospuesta" ? '<button type="button" class="pos-hoy">Volver a hoy</button>' : ""}
      <button type="button" class="modo-opc">${t.modo==="opcional" ? "Hacerla obligatoria" : "Opcional"}</button>
      <button type="button" class="modo-cong">${t.modo==="congelada" ? "Descongelar" : "❄️ Congelar"}</button>
      ${t.tipo==="repetitiva" ? '<span class="timer-label">Repetir:</span><select class="pos-frec">'+FREC_OPCIONES.map(([v,l])=>'<option value="'+v+'"'+(t.frecuencia===v?" selected":"")+'>'+l+'</option>').join("")+'</select>' : ""}
      <button type="button" class="timer-cerrar">Cancelar</button>`;
    fila.querySelectorAll("button[data-d]").forEach(b=>{ b.onclick = ()=>posponer(t, parseInt(b.dataset.d,10)); });
    fila.querySelector(".pos-ok").onclick = ()=>posponer(t, parseInt(fila.querySelector(".pos-dias").value,10));
    const hoyBtn = fila.querySelector(".pos-hoy");
    if(hoyBtn) hoyBtn.onclick = ()=>volverAHoy(t);
    const selF = fila.querySelector(".pos-frec");
    if(selF) selF.onchange = ()=>cambiarFrecuencia(t, selF.value);
    fila.querySelector(".modo-opc").onclick = ()=>cambiarModo(t, t.modo==="opcional" ? "normal" : "opcional");
    fila.querySelector(".modo-cong").onclick = ()=>cambiarModo(t, t.modo==="congelada" ? "normal" : "congelada");
    fila.querySelector(".timer-cerrar").onclick = ()=>{ posponerAbiertoEn = null; render(); };
    sec.appendChild(fila);
  }

  if(timers[t.id] !== undefined){
    const m = Math.floor(timers[t.id]/60), s = timers[t.id]%60;
    const filaTimer = document.createElement("div");
    filaTimer.className = "timer-row";
    filaTimer.innerHTML = `
      <span class="timer-label">⏱️ ${t.nombre}:</span>
      <span class="timer-restante" data-id="${t.id}">${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</span>
      <button type="button" class="timer-cerrar">Cancelar</button>`;
    filaTimer.querySelector(".timer-cerrar").onclick = ()=>cancelarTimer(t.id);
    sec.appendChild(filaTimer);
  } else if(timerAbiertoEn === t.id){
    const filaTimer = document.createElement("div");
    filaTimer.className = "timer-row";
    filaTimer.innerHTML = `
      <span class="timer-label">Avisame en</span>
      <input type="number" min="1" class="timer-minutos" value="5">
      <span class="timer-label">min</span>
      <button type="button" class="timer-iniciar">Iniciar</button>
      <button type="button" class="timer-cerrar">Cancelar</button>`;
    filaTimer.querySelector(".timer-iniciar").onclick = ()=>{
      const min = parseFloat(filaTimer.querySelector(".timer-minutos").value);
      iniciarTimer(t.id, min);
    };
    filaTimer.querySelector(".timer-cerrar").onclick = ()=>{ timerAbiertoEn = null; render(); };
    sec.appendChild(filaTimer);
  }
}

  cont.innerHTML = "";
  let tareasLista = estado.tareas.filter(t=>t.lista===listaActiva);
  if(filtroFrec) tareasLista = tareasLista.filter(t=>t.tipo!=="repetitiva" || t.frecuencia===filtroFrec);
  if(filtroEstado!=="todas") tareasLista = tareasLista.filter(t=>estadoTarea(t)===filtroEstado);

  if(listaActiva === "casa"){
    // En Casa hay demasiadas tareas para agruparlas por horario (no lo usan) —
    // se agrupan por zona de la casa, y se puede filtrar a una sola zona.
    if(zonaFiltro){
      tareasLista = tareasLista.filter(t => (t.zona||"Sin zona") === zonaFiltro);
    }
    visibles = tareasLista;
    const orden = ZONAS.concat(["Sin zona"]);
    const zonasPresentes = [...new Set(tareasLista.map(t=>t.zona||"Sin zona"))]
      .sort((a,b)=> orden.indexOf(a) - orden.indexOf(b));

    zonasPresentes.forEach(zona=>{
      const tareasZona = tareasLista.filter(t => (t.zona||"Sin zona") === zona)
        .sort(ordenTareas);
      cont.appendChild(crearSeccion(zona, zona, tareasZona));
    });

    if(tareasLista.length===0){
      cont.innerHTML = `<div class="empty-franja">Nada para mostrar con estos filtros.</div>`;
    }
  } else {
    visibles = tareasLista;
    FRANJAS.forEach(f=>{
      const tareasFranja = tareasLista.filter(t=> (t.franja||null) === f.clave )
        .sort(ordenTareas);
      if(tareasFranja.length===0) return;

      cont.appendChild(crearSeccion(f.label, f.label, tareasFranja));
    });

    if(tareasLista.length===0){
      cont.innerHTML = `<div class="empty-franja">Nada para mostrar con estos filtros. Si la lista está vacía, agregá una tarea con el botón de abajo.</div>`;
    }
  }
}

document.getElementById("accionLote").onchange = e=>{
  const modo = e.target.value; e.target.value = "";
  if(!modo) return;
  const esFrec = modo.startsWith("frec:");
  const objetivo = esFrec ? visibles.filter(t=>t.tipo==="repetitiva") : visibles;
  if(objetivo.length===0){ alert("No hay tareas a las que aplicar esto con los filtros actuales."); return; }
  const txt = esFrec ? "Cambiar la frecuencia a «"+modo.slice(5)+"» en" : {opcional:"Marcar como opcionales", congelada:"Congelar", normal:"Devolver a normales"}[modo];
  if(!confirm(txt+" "+objetivo.length+" tareas (las que se ven con los filtros actuales)?")) return;
  objetivo.forEach(t=>{ if(esFrec) t.frecuencia = modo.slice(5); else if(modo==="normal") delete t.modo; else t.modo = modo; });
  guardarEstado(); render();
};

function grupoValor(id){
  return document.querySelector(`#${id} button.on`).dataset.v;
}
function activarGrupo(id, cb){
  document.querySelectorAll(`#${id} button`).forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      if(cb) cb(b.dataset.v);
    };
  });
}

function actualizarSubOpciones(tipo){
  document.getElementById("subHorario").classList.toggle("show", tipo==="horario");
  document.getElementById("subRepetitiva").classList.toggle("show", tipo==="repetitiva");
}

function abrirFormulario(){
  const form = document.getElementById("formTarea");
  form.style.display = "block";
  form.innerHTML = formularioHTML();
  document.getElementById("btnNueva").style.display = "none";

  activarGrupo("fLista");
  activarGrupo("fTipo", (v)=>actualizarSubOpciones(v));
  activarGrupo("fReseteo");
  actualizarSubOpciones("simple");

  document.getElementById("fCancelar").onclick = cerrarFormulario;
  document.getElementById("fGuardar").onclick = guardarNuevaTarea;
}
function cerrarFormulario(){
  document.getElementById("formTarea").style.display = "none";
  document.getElementById("formTarea").innerHTML = "";
  document.getElementById("btnNueva").style.display = "block";
}
function guardarNuevaTarea(){
  const nombre = document.getElementById("fNombre").value.trim();
  if(!nombre){ alert("Escribí un nombre para la tarea."); return; }
  const tipo = grupoValor("fTipo");
  const nueva = {
    id: Date.now().toString(36),
    nombre,
    lista: grupoValor("fLista"),
    zona: document.getElementById("fZona").value || null,
    tipo,
    franja: tipo==="horario" ? document.getElementById("fFranja").value : null,
    frecuencia: tipo==="repetitiva" ? document.getElementById("fFrecuencia").value : null,
    reseteo: tipo==="repetitiva" ? grupoValor("fReseteo") : null,
    completada: false,
    historial: []
  };
  estado.tareas.push(nueva);
  guardarEstado();
  listaActiva = nueva.lista;
  cerrarFormulario();
  render();
}

// Devuelve true si añadió tareas (hay que guardar). La marca local solo se pone cuando ya están en la lista leída de la nube.
function ampliarTareasCasa(){
  if(localStorage.getItem("tareasCasaAmpliacion_v1")) return false;
  if(estado.tareas.some(t=>String(t.id).indexOf("casa_ampl1_")===0)){ localStorage.setItem("tareasCasaAmpliacion_v1","1"); return false; }
  tareasAmpliacion1().forEach((f,i)=>{
    estado.tareas.push({ id:"casa_ampl1_"+i, nombre:f[0], lista:"casa", zona:f[1], tipo:"repetitiva", franja:null,
      frecuencia:f[2], reseteo:"auto", unaBasta:true, historialPor:{ Mamy:[], Filha:[] } });
  });
  return true;
}

function sembrarTareasCasaSiHaceFalta(){
  if(localStorage.getItem(SEMILLA_V2)) return;
  if(localStorage.getItem(SEMILLA_V1)) return; // ya tenía la lista anterior: se ofrece reducirla con el botón (no se borra nada sola)
  construirSemillaCasa().forEach((f,i)=>{ if(!estado.tareas.some(t=>t.id==="casa_seed50_"+i)) estado.tareas.push(tareaDeSemilla(f,i)); });
  localStorage.setItem(CLAVE, JSON.stringify(estado)); // solo local: no se sube sin haber leído antes la nube (si no, podría pisarla)
  localStorage.setItem(SEMILLA_V1, "1"); localStorage.setItem(SEMILLA_V2, "1");
}

function reducirTareasCasa(auto){
  const viejas = estado.tareas.filter(esSemillaVieja);
  const propias = estado.tareas.filter(t=>(t.lista==="casa") && !esSemillaVieja(t) && !esSemillaNueva(t)).length;
  const filas = construirSemillaCasa();
  if(viejas.length){
    if(auto !== true && !confirm("Esto va a reemplazar las "+viejas.length+" tareas de casa que creó la app por una lista de "+filas.length+" tareas agrupadas.\n• Las tareas que añadiste tú ("+propias+") se quedan.\n• Se pierde lo marcado y el historial de las tareas reemplazadas (en «Hecho recientemente»).\nSi quieres conservarlo, descarga antes una copia en ⚙️ Ajustes.\n¿Continuar?")) return;
    estado.tareas = estado.tareas.filter(t=>!esSemillaVieja(t));
  }
  filas.forEach((f,i)=>{ if(!estado.tareas.some(t=>t.id==="casa_seed50_"+i)) estado.tareas.push(tareaDeSemilla(f,i)); });
  ampliarTareasCasa(); // mantiene las tareas de la ampliación (Según necesidad, etc.) si todavía no estaban
  guardarEstado(); // sube la lista nueva a la nube
  localStorage.setItem(SEMILLA_V1, "1"); localStorage.setItem(SEMILLA_V2, "1");
  render();
}

function renderHistorialTareas(){
  const box = document.getElementById("htLista"); if(!box) return;
  const yo = miPerfil(), persona = document.getElementById("htPersona").value, per = document.getElementById("htPeriodo").value;
  const desde = per ? (()=>{ const d = new Date(); d.setDate(d.getDate()-parseInt(per,10)); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })() : "";
  const filas = [];
  estado.tareas.forEach(t=>{
    if(!(t.lista==="casa" || t.lista==="invitadas" || !yo || t.lista===yo)) return;
    const vistos = new Set();
    (t.registro||[]).forEach(r=>{ filas.push({f:r.f, h:r.h||"", p:r.p, n:t.nombre, z:t.zona||"", viejo:false}); vistos.add(r.f+"|"+r.p); });
    if(t.tipo==="repetitiva" && t.reseteo==="auto" && t.frecuencia==="diaria"){ // datos anteriores al registro (solo las diarias guardan el día exacto)
      (t.historial||[]).forEach(f=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(f) && !vistos.has(f+"|"+t.lista)) filas.push({f, h:"", p:t.lista, n:t.nombre, z:t.zona||"", viejo:true}); });
      Object.keys(t.historialPor||{}).forEach(p=> (t.historialPor[p]||[]).forEach(f=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(f) && !vistos.has(f+"|"+p)) filas.push({f, h:"", p, n:t.nombre, z:t.zona||"", viejo:true}); }));
    }
  });
  const v = filas.filter(x=> (!persona || x.p===persona) && (!desde || x.f>=desde)).sort((a,b)=> (b.f+b.h).localeCompare(a.f+a.h)).slice(0,150);
  const esc = s=> String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let h = "", ult = "";
  v.forEach(x=>{
    if(x.f !== ult){ ult = x.f; const p = x.f.split("-"); h += `<div style="margin:10px 0 2px;font-weight:700;text-transform:capitalize">${new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</div>`; }
    h += `<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)"><span>✔ ${esc(x.n)}${x.z?` <small style="opacity:.6">· ${esc(x.z)}</small>`:""}</span><span style="opacity:.8;white-space:nowrap">${esc(x.p)}${x.h?" · "+x.h:""}${x.viejo?" · antiguo":""}</span></div>`;
  });
  box.innerHTML = h || '<p style="opacity:.7">Aún no hay tareas registradas. Desde ahora, cada tarea que marques como hecha se anota aquí con el día, la hora y quién la hizo.</p>';
}
document.getElementById("htPersona").onchange = renderHistorialTareas;
document.getElementById("htPeriodo").onchange = renderHistorialTareas;

}
render();
