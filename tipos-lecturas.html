<!DOCTYPE html>
<html lang="es">
<head>
  <script>document.documentElement.style.visibility = "hidden";</script>
  <script type="module" src="js/muro-login.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegí un tema — El Código de las Cartas</title>
  <meta name="description" content="282 tiradas de Tarot repartidas en 10 temas de consulta.">

  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Grid de temas — no hay clase previa para esto en components.css,
       se resuelve inline por ahora; si se repite el patrón en otra
       página se promueve a components.css (Sección 10.1: extender
       antes que reescribir). */
    .grid-temas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--space-3);
    }
    .tema-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-3);
      background: var(--bg-card);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s ease, transform 0.15s ease;
      color: inherit;
      font: inherit;
    }
    .tema-card:hover {
      border-color: rgba(201, 168, 76, 0.5);
      transform: translateY(-2px);
    }
    .tema-card__icono {
      font-size: 1.5rem;
      color: var(--secondary);
    }
    .tema-card__nombre {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--text-main);
    }
    .tema-card__conteo {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body data-page="tipos-lecturas">

  <header class="nav">
    <a href="index.html" class="nav__logo">El Código de las Cartas</a>
    <nav class="nav__links">
      <a href="introduccion.html" class="nav__link">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>&nbsp;Cambiar mazo
      </a>
      <a href="index.html" class="nav__link">
        <i class="ph ph-house" aria-hidden="true"></i>&nbsp;Inicio
      </a>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <div class="container--narrow">
        <h1 class="page-header__title">¿Sobre qué querés consultar?</h1>
        <p class="page-header__subtitle" id="subtitulo">
          282 tiradas repartidas en 10 temas.
        </p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div class="grid-temas" id="grid-temas" aria-live="polite">
          <!-- Se genera por JS. Mientras carga: -->
          <p style="color: var(--text-muted);">
            <i class="ph ph-spinner" aria-hidden="true"></i> Cargando temas…
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="section--tight" style="text-align:center; color: var(--text-muted); font-size: 0.8rem;">
    <p>El Código de las Cartas · Tarot de Marsella &amp; Rider-Waite-Smith</p>
  </footer>

  <script type="module">
    import { getTradicion, navigateTo } from './js/navigation.js';

    // Copia editorial del listado de temas — el enum en sí (10 valores)
    // viene validado por readings-marsella.js/readings-rws.js
    // (TEMAS_VALIDOS, Sección 8.6). Iconos tomados de los ya definidos
    // en icons.css que no aparecían asignados en la tabla de la
    // Sección 6.4 (amor→heart, viajes→airplane, etc. — set cerrado,
    // no CDN, ver auditoría de icons.css).
    const TEMAS = [
      { id: 'amor',                       nombre: 'Amor y vínculos',        icono: 'ph-heart' },
      { id: 'trabajo_dinero',             nombre: 'Trabajo y dinero',       icono: 'ph-briefcase-metal' },
      { id: 'familia_hogar',              nombre: 'Familia y hogar',        icono: 'ph-users' },
      { id: 'salud_bienestar',            nombre: 'Salud y bienestar',      icono: 'ph-pulse' },
      { id: 'decisiones_elecciones',      nombre: 'Decisiones',             icono: 'ph-intersect' },
      { id: 'crisis_transformacion',      nombre: 'Crisis y transformación', icono: 'ph-graph' },
      { id: 'espiritualidad_crecimiento', nombre: 'Espiritualidad',         icono: 'ph-compass-rose' },
      { id: 'creatividad_proyectos',      nombre: 'Creatividad y proyectos', icono: 'ph-paint-brush' },
      { id: 'viajes_mudanzas',            nombre: 'Viajes y mudanzas',      icono: 'ph-airplane' },
      { id: 'consultas_generales',        nombre: 'Consultas generales',    icono: 'ph-star' },
    ];

    const grid = document.getElementById('grid-temas');
    const subtitulo = document.getElementById('subtitulo');

    async function init() {
      const tradicion = getTradicion();

      // No hay caso de recovery documentado para esta página en la
      // Sección 5.3 — se aplica el mismo criterio que el resto del
      // flujo: sin tradición activa, no hay de dónde leer tiradas.
      if (!tradicion) {
        navigateTo('introduccion.html');
        return;
      }

      try {
        const dataModule = tradicion === 'rws'
          ? await import('./js/data-rws.js')
          : await import('./js/data-marsella.js');

        const tiradas = await dataModule.getTiradas();
        const conteos = tiradas.reduce((acc, t) => {
          acc[t.tema] = (acc[t.tema] || 0) + 1;
          return acc;
        }, {});

        subtitulo.textContent = `${tiradas.length} tiradas repartidas en 10 temas — tradición ${tradicion === 'rws' ? 'Rider-Waite-Smith' : 'Marsella'}.`;

        grid.innerHTML = '';
        TEMAS.forEach(tema => {
          const n = conteos[tema.id] || 0;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tema-card';
          btn.innerHTML = `
            <i class="ph ${tema.icono} tema-card__icono" aria-hidden="true"></i>
            <span class="tema-card__nombre">${tema.nombre}</span>
            <span class="tema-card__conteo">${n} tirada${n === 1 ? '' : 's'}</span>
          `;
          btn.addEventListener('click', () => {
            navigateTo(`listado-tiradas.html?tema=${tema.id}`);
          });
          grid.appendChild(btn);
        });

      } catch (err) {
        console.error('[tipos-lecturas] Error cargando tiradas:', err);
        grid.innerHTML = `
          <p style="color: var(--text-muted);">
            <i class="ph ph-warning-circle" aria-hidden="true"></i>
            No se pudieron cargar los temas. Probá recargar la página.
          </p>
        `;
      }
    }

    init();
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
